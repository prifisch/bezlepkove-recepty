name: Update V06CE Data

on:
  schedule:
    - cron: '0 2 2 * *' # Spustí sa automaticky každý mesiac 2. dňa o 2:00 ráno
  workflow_dispatch: # Umožňuje spustiť aktualizáciu ručne jedným kliknutím kedykoľvek

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run extractor script
        run: |
          python scripts/extractor.py

      - name: Commit and push changes if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/v06ce.json
          git diff --staged --quiet || (git commit -m "Auto-update V06CE data [skip ci]" && git push)
